services:

  mysql:
    image: mysql:8.0
    container_name: tradeforge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # Persists DB data on VM hard drive

  redis:
    image: redis:7-alpine
    container_name: tradeforge_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: tradeforge_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_URL: mysql://root:${DATABASE_PASSWORD}@mysql:3306/${DATABASE_NAME}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      UPSTOX_TOKEN: ${UPSTOX_TOKEN}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      UPSTOX_STOCK_FETCH_URL: ${UPSTOX_STOCK_FETCH_URL}
    depends_on:
      - mysql
      - redis

volumes:
  mysql_data: